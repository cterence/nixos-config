# Source: https://github.com/tlvince/nixos-config/blob/master/.github/workflows/update-flake.yml
name: Update flake
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # https://status.nixos.org shows the last update time
      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Delete stale update branch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head update_flake_lock_action --state open --json number --jq 'length')
          if [ "$prs" = "0" ]; then
            git push origin --delete update_flake_lock_action || true
          fi
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        id: update-flake-lock
        with:
          commit-msg: "chore(flake.lock): update"
          pr-body: |
            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```
          pr-title: "chore(flake.lock): update"
          pr-labels: |
            automated
            automerge
            dependencies
          nix-options: "--option access-tokens github.com=${{ steps.generate-token.outputs.token }} --extra-access-tokens gitlab.com=PAT:${{ secrets.GITLAB_TOKEN }}"
          token: ${{ steps.generate-token.outputs.token }}
      - name: Create compare URLs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.update-flake-lock.outputs.pull-request-operation == 'created' || steps.update-flake-lock.outputs.pull-request-operation == 'updated'
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            const comment = require('.github/scripts/comment')
            const compare = require('.github/scripts/compare')

            const urls = await compare({ core })
            if (!urls?.length) {
              return
            }

            const header = "# Compare URLs"
            const body = urls.map((url) => `- ${url}`).join("\n")

            const issueNumber = parseInt(process.env.PULL_REQUEST_NUMBER, 10)
            if (Number.isNaN(issueNumber)) {
              return
            }

            await comment({ github, context, header, body, issueNumber })

  # Pinned package sweep: runs alongside the lockfile job. Checks every pin
  # in modules/pins.nix against Hydra's nixpkgs/unstable builds, then drops
  # green pins and pins red closure packages at their last good version via
  # an automerge PR.
  sweep:
    name: Sweep pins (Hydra)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: pinned-sweep-check
      cancel-in-progress: false
    outputs:
      unknown: ${{ steps.check.outputs.unknown }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: Check pins against Hydra
        id: check
        run: |
          nix run .#pinned-sweep -- check --json \
            --option access-tokens github.com=${{ steps.generate-token.outputs.token }} \
            > "$RUNNER_TEMP/verdict.json"
          echo "unknown=$(jq '[.pins[] | select([.platforms[].status] | index("unknown"))] | length' "$RUNNER_TEMP/verdict.json")" >> "$GITHUB_OUTPUT"
      - name: Upload verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdict
          path: ${{ runner.temp }}/verdict.json
          if-no-files-found: error

  # Fallback for pins Hydra has no data on (unfree, hydraPlatforms = []):
  # build them from nixos-unstable natively. Only spins a macOS runner when
  # such pins exist.
  fallback:
    name: Build unknown pins
    needs: sweep
    if: needs.sweep.outputs.unknown != '0'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: Check pins with build fallback
        run: |
          nix run .#pinned-sweep -- check --json --build-unknown \
            --option access-tokens github.com=${{ steps.generate-token.outputs.token }} \
            > "$RUNNER_TEMP/verdict-fallback.json"
      - name: Upload fallback verdict
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verdict-fallback
          path: ${{ runner.temp }}/verdict-fallback.json
          if-no-files-found: error

  apply:
    name: Apply pin sweep
    needs: [sweep, fallback]
    if: >-
      always() &&
      needs.sweep.result == 'success' &&
      (needs.fallback.result == 'success' || needs.fallback.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          determinate: false
      - name: Download verdicts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        continue-on-error: true
        with:
          pattern: verdict*
          path: ${{ runner.temp }}
          merge-multiple: true
      - name: Apply sweep
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "pinned-sweep[bot]"
          git config user.email "pinned-sweep[bot]@users.noreply.github.com"
          nix run .#pinned-sweep -- apply --pr \
            --verdict "$RUNNER_TEMP/verdict.json" \
            --verdict "$RUNNER_TEMP/verdict-fallback.json" \
            --option access-tokens github.com=${{ steps.generate-token.outputs.token }} \
            | tee "$GITHUB_STEP_SUMMARY"
