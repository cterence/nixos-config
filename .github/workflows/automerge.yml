name: automerge
on:
  workflow_run:
    workflows: [Build]
    types:
      - completed
  # Rebases outdated automerge PRs (e.g. the lock PR picking up a pin) as
  # soon as anything lands on main, not just after a successful Build run.
  push:
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    runs-on: ubuntu-latest
    concurrency:
      group: automerge
      cancel-in-progress: false
    steps:
      - name: Generate Github app token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # scope to all installation repos, not just this one (private inputs)
          owner: ${{ github.repository_owner }}
      - name: Check for automerge PRs
        id: prs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # No checkout in this job — tell gh which repo to talk to.
          count=$(gh pr list -R "$GITHUB_REPOSITORY" --base main --label automerge --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - id: automerge
        name: automerge
        uses: "pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67" # v0.16.4
        # The action throws on a push with no matching PRs, so only run it
        # then when there is something to process.
        if: >-
          ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
          (github.event_name == 'push' && steps.prs.outputs.count != '0') }}
        # Push-triggered runs only rebase; update-only exits non-zero
        # (pascalgn/automerge-action#191).
        continue-on-error: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: "${{ steps.generate-token.outputs.token }}"
          MERGE_METHOD: "rebase"
          UPDATE_METHOD: "rebase"
